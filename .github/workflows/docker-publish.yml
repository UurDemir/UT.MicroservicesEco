name: Docker publish

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apigateway
            context: .
            file: UT.MicroserviceEco.ApiGateway/Dockerfile
          - name: authservice
            context: .
            file: UT.MicroserviceEco.AuthService/Dockerfile
          - name: productservice
            context: .
            file: UT.MicroserviceEco.ProductService/Dockerfile
          - name: basketservice
            context: .
            file: UT.MicroserviceEco.BasketService/Dockerfile
          - name: orderservice
            context: .
            file: UT.MicroserviceEco.OrderService/Dockerfile
          - name: deliveryservice
            context: .
            file: UT.MicroserviceEco.DeliveryService/Dockerfile
          - name: ecommerce-web
            context: ./ecommerce-web
            file: ecommerce-web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
