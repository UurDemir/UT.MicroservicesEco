name: Deploy Docker Compose

on:
  workflow_dispatch:
    inputs:
      remote_path:
        description: "Absolute path on the server (created if missing)"
        required: true
        default: /opt/utmicroserviceseco
      ssh_port:
        description: "SSH port on the server"
        required: true
        default: "22"

# Optional: deploy after images are built (uncomment and set branch if desired)
#  workflow_run:
#    workflows: ["Docker publish"]
#    types: [completed]
#    branches: [main]

concurrency:
  group: deploy-compose-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: |
          dotnet tool install -g Aspire.Cli --version 13.2.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish Compose bundle
        working-directory: UT.MicroserviceEco.Host/UT.MicroserviceEco.Host.AppHost
        run: aspire publish -o "$GITHUB_WORKSPACE/compose-bundle" --yes

      - name: Merge .env (Aspire publish + DEPLOY_DOTENV)
        env:
          DEPLOY_DOTENV: ${{ secrets.DEPLOY_DOTENV }}
        run: |
          if [ -z "${DEPLOY_DOTENV}" ]; then
            echo "Missing repository secret DEPLOY_DOTENV. Use deploy/env.example as a template (multiline secret)."
            exit 1
          fi
          python3 << 'PY'
          import os
          import re
          from pathlib import Path

          def parse_env(text: str) -> dict[str, str]:
              env: dict[str, str] = {}
              for line in text.splitlines():
                  line = line.rstrip("\r\n")
                  stripped = line.lstrip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  if "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  key = key.strip()
                  if not re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", key):
                      continue
                  env[key] = value
              return env

          bundle = Path(os.environ["GITHUB_WORKSPACE"]) / "compose-bundle"
          base_path = bundle / ".env"
          if not base_path.is_file():
              raise SystemExit(f"Missing {base_path} after aspire publish")
          base = parse_env(base_path.read_text(encoding="utf-8"))
          user = parse_env(os.environ["DEPLOY_DOTENV"])
          merged = {**base, **user}
          lines = [f"{k}={merged[k]}" for k in sorted(merged.keys())]
          base_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Prepare SSH (password only)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ inputs.ssh_port }}
        run: |
          set -euo pipefail
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; s="${s%"${s##*[![:space:]]}"}"; printf '%s' "$s"; }
          PASS="$(printf '%s' "${SSH_PASSWORD:-}" | tr -d '\r')"
          PASS="$(trim "$PASS")"
          if [ -z "$PASS" ]; then
            echo "Set repository secret SSH_PASSWORD."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s' "$PASS" > "$RUNNER_TEMP/.compose_deploy_sshpass"
          chmod 600 "$RUNNER_TEMP/.compose_deploy_sshpass"

      - name: Sync bundle to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          REMOTE_PATH: ${{ inputs.remote_path }}
        run: |
          set -euo pipefail
          PASSFILE="$RUNNER_TEMP/.compose_deploy_sshpass"
          PW_SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
          run_ssh() { sshpass -f "$PASSFILE" ssh $PW_SSH_OPTS "$@"; }
          RSYNC_RSH="sshpass -f $PASSFILE ssh $PW_SSH_OPTS"
          run_ssh "${SSH_USER}@${SSH_HOST}" "mkdir -p -- '${REMOTE_PATH}'"
          rsync -avz --delete -e "$RSYNC_RSH" \
            "$GITHUB_WORKSPACE/compose-bundle/" \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Pull images and restart stack on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          REMOTE_PATH: ${{ inputs.remote_path }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          PASSFILE="$RUNNER_TEMP/.compose_deploy_sshpass"
          PW_SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
          run_ssh() { sshpass -f "$PASSFILE" ssh $PW_SSH_OPTS "$@"; }
          {
            printf 'set -euo pipefail\ncd %q\n' "$REMOTE_PATH"
            printf '%s\n' \
              'if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USER:-}" ]; then' \
              '  echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin' \
              'else' \
              '  echo "GHCR_PULL_* not set; skipping docker login (OK if images are public)."' \
              'fi' \
              'docker compose pull' \
              'docker compose up -d --remove-orphans'
          } > /tmp/remote_compose.sh
          run_ssh "${SSH_USER}@${SSH_HOST}" \
            env "GHCR_USER=$(printf '%q' "${GHCR_USER:-}")" "GHCR_TOKEN=$(printf '%q' "${GHCR_TOKEN:-}")" bash -s \
            < /tmp/remote_compose.sh
