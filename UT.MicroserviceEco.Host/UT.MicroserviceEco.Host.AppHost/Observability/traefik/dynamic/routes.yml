# Host-based routing for Docker Compose publish. Point DNS A/AAAA records for each host to the machine running compose.
# TLS is expected to be terminated in front of Traefik (e.g. Cloudflare); backends see X-Forwarded-Proto=https.
http:
  middlewares:
    edge-https:
      headers:
        sslProxyHeaders:
          X-Forwarded-Proto: "https"

  routers:
    rt-jaeger:
      rule: Host(`jaeger.ugurdemir.dev`)
      entryPoints: [web]
      middlewares: [edge-https]
      service: svc-jaeger
    rt-prometheus:
      rule: Host(`prometheus.ugurdemir.dev`)
      entryPoints: [web]
      middlewares: [edge-https]
      service: svc-prometheus
    rt-grafana:
      rule: Host(`grafana.ugurdemir.dev`)
      entryPoints: [web]
      middlewares: [edge-https]
      service: svc-grafana
    rt-kibana:
      rule: Host(`kibana.ugurdemir.dev`)
      entryPoints: [web]
      middlewares: [edge-https]
      service: svc-kibana
    rt-apigateway:
      rule: Host(`apigateway.ugurdemir.dev`)
      entryPoints: [web]
      middlewares: [edge-https]
      service: svc-apigateway
    rt-ecommerce:
      rule: Host(`ecommerce.ugurdemir.dev`)
      entryPoints: [web]
      middlewares: [edge-https]
      service: svc-ecommerce

  services:
    svc-jaeger:
      loadBalancer:
        servers:
          - url: http://jaeger:16686
    svc-prometheus:
      loadBalancer:
        servers:
          - url: http://prometheus:9090
    svc-grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
    svc-kibana:
      loadBalancer:
        servers:
          - url: http://kibana:5601
    svc-apigateway:
      loadBalancer:
        servers:
          - url: http://apigateway:8080
    svc-ecommerce:
      loadBalancer:
        servers:
          # Production image (ecommerce-web/Dockerfile) is nginx on :80, not dev :4200
          - url: http://ecommerce-web:80
