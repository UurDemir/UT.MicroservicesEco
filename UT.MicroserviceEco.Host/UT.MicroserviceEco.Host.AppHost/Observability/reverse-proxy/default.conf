# Host-based reverse proxy. HTTP always; HTTPS on :443 when PEMs are mounted at /etc/nginx/ssl/.
# Cloudflare: use "Full" or "Full (strict)" and install an Origin Certificate (or LE) as fullchain.pem + privkey.pem.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      "https";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/conf.d/ssl-params.conf;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    return 404;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name jaeger.ugurdemir.dev;
    include /etc/nginx/conf.d/ssl-params.conf;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    location / {
        proxy_pass http://jaeger:16686;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
    }
}

